unbind C-b
unbind r
bind r source-file ~/.config/tmux/tmux.conf

set-option -g default-shell /opt/homebrew/bin/zsh
set -g prefix C-a
bind C-a send-prefix
set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top
set-window-option -g mode-keys vi
set -g history-limit 10000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g default-terminal "tmux-256color"
set -g terminal-overrides ",*256col*:Tc"

set -g @nord_tmux_show_status_content "0"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'arcticicestudio/nord-tmux'

set -g @tpm_plugins_path '~/.config/tmux/plugins'

# initialize tmux plugin manager (nur EINMAL aufrufen)
run '~/.config/tmux/plugins/tpm/tpm'

# --- Statusbar-Konfiguration (nach run, damit Nord sie nicht ueberschreibt) ---
set -g status-style "bg=#2e3440,fg=#e5e9f0"
set -g status-left-length 100
set -g status-right-length 100

# Links: Session-Segment (Blau)
set -g status-left "#[fg=#2e3440,bg=#88c0d0,bold]  #S #[fg=#88c0d0,bg=#2e3440,nobold]"

# Rechts: Uhrzeit (AM/PM) -> Hostname
set -g status-right "#[fg=#5e81ac,bg=#2e3440]#[fg=#2e3440,bg=#5e81ac,bold]  %I:%M %p #[fg=#b48ead,bg=#5e81ac]#[fg=#2e3440,bg=#b48ead,bold]   #h "

# Fenster (Tabs)
set -g window-status-format "#[fg=#e5e9f0,bg=#3b4252] #I #W "
set -g window-status-current-format "#[fg=#3b4252,bg=#a3be8c]#[fg=#2e3440,bg=#a3be8c,bold] #I #W #[fg=#a3be8c,bg=#2e3440]"
set -g window-status-separator ""

# Panes
set -g pane-active-border-style "fg=#88c0d0"
set -g pane-border-style "fg=#3b4252"

# Nachrichten/Prompt
set -g message-style "fg=#2e3440,bg=#ebcb8b,bold"
set -g message-command-style "fg=#2e3440,bg=#ebcb8b,bold"
